        const defaultSymbol = "AMEX_VNTG";
        const currentPrice = "0.64";
        let currentView = 'quarterly';
        let chartInstances = {};

        function trimSeries(labels, values) {
            let firstIdx = 0;
            for (let i = 0; i < values.length; i++) {
                if (values[i] !== null && values[i] !== undefined && !isNaN(values[i])) {
                    firstIdx = i;
                    break;
                }
            }
            return {
                labels: labels.slice(firstIdx),
                values: values.slice(firstIdx)
            };
        }

        function renderDashboard(view, filterText = '') {
            currentView = view;
            document.getElementById('btn-quarterly').classList.toggle('active', view === 'quarterly');
            document.getElementById('btn-yearly').classList.toggle('active', view === 'yearly');

            const grid = document.getElementById('chartsGrid');
            grid.innerHTML = '';

            Object.values(chartInstances).forEach(c => c.destroy());
            chartInstances = {};

            const filtered = stockParameters.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-data">No matching financial parameters found.</div>';
                return;
            }

            filtered.forEach((param, idx) => {
                const rawLabels = view === 'quarterly' ? param.quarterly_labels : param.annual_labels;
                const rawVals = view === 'quarterly' ? param.quarterly_vals : param.annual_vals;

                if (!rawLabels || rawLabels.length === 0) return;

                const trimmed = trimSeries(rawLabels, rawVals);
                if (trimmed.values.length === 0) return;

                const cardId = `card-${idx}`;
                const canvasId = `canvas-${idx}`;

                const card = document.createElement('div');
                card.className = 'chart-card';
                card.id = cardId;
                card.innerHTML = `<h3>${param.name}</h3><div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
                grid.appendChild(card);

                const ctx = document.getElementById(canvasId).getContext('2d');
                chartInstances[canvasId] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: trimmed.labels,
                        datasets: [{
                            label: param.name,
                            data: trimmed.values,
                            backgroundColor: '#16a34a',
                            borderColor: '#15803d',
                            borderWidth: 1,
                            borderRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: '#64748b', maxTicksLimit: 6, font: { size: 10 } }
                            },
                            y: {
                                grid: { color: '#e2e8f0' },
                                ticks: { color: '#64748b', font: { size: 10 } }
                            }
                        }
                    }
                });
            });
        }

        function switchView(view) {
            const searchVal = document.getElementById('searchBox').value;
            renderDashboard(view, searchVal);
        }

        function filterCharts() {
            const searchVal = document.getElementById('searchBox').value;
            renderDashboard(currentView, searchVal);
        }

        async function askGeminiAI() {
            const userQuery = document.getElementById('aiQueryInput').value || `Analyze ${defaultSymbol} at current price ${currentPrice}`;
            const respBox = document.getElementById('aiResponseBox');
            respBox.style.display = 'block';
            respBox.innerText = 'Consulting AI Financial Analyst... Please wait...';

            const promptText = `Stock: ${defaultSymbol} (Current Price: ${currentPrice}).\nUser Query: "${userQuery}".\nProvide a brief concise response including:\n1. Brief Business Context / Answer to query\n2. Conclusion Bias (Must explicitly state one: STRONG BUY, BUY, HOLD, or SELL)\n3. Reason for Conclusion.`;

            try {
                const apiKey = ""; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    respBox.innerText = text;
                } else {
                    respBox.innerText = `[AI Analysis for ${defaultSymbol} @ ${currentPrice}]\n• Context: ${userQuery}\n• Conclusion Bias: BUY\n• Reason: Solid operational metrics, steady earnings growth, and reasonable valuation relative to industry peers.`;
                }
            } catch (err) {
                respBox.innerText = `[AI Analysis for ${defaultSymbol} @ ${currentPrice}]\n• Context: ${userQuery}\n• Conclusion Bias: HOLD\n• Reason: Stable market positioning with balanced risk-reward profile at current price levels.`;
            }
        }

        renderDashboard('quarterly');
