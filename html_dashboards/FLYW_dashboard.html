        const defaultSymbol = "FLYW";
        const currentPrice = "19.69";
        let currentView = 'quarterly';
        let chartInstances = {};

        function trimSeries(labels, values) {
            let firstIdx = 0;
            for (let i = 0; i < values.length; i++) {
                if (values[i] !== null && values[i] !== undefined && !isNaN(values[i])) {
                    firstIdx = i;
                    break;
                }
            }
            return {
                labels: labels.slice(firstIdx),
                values: values.slice(firstIdx)
            };
        }

        function renderDashboard(view, filterText = '') {
            currentView = view;
            document.getElementById('btn-quarterly').classList.toggle('active', view === 'quarterly');
            document.getElementById('btn-yearly').classList.toggle('active', view === 'yearly');

            const grid = document.getElementById('chartsGrid');
            grid.innerHTML = '';

            Object.values(chartInstances).forEach(c => c.destroy());
            chartInstances = {};

            const filtered = stockParameters.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-data">No matching financial parameters found.</div>';
                return;
            }

            filtered.forEach((param, idx) => {
                const rawLabels = view === 'quarterly' ? param.quarterly_labels : param.annual_labels;
                const rawVals = view === 'quarterly' ? param.quarterly_vals : param.annual_vals;

                if (!rawLabels || rawLabels.length === 0) return;

                const trimmed = trimSeries(rawLabels, rawVals);
                if (trimmed.values.length === 0) return;

                const cardId = `card-${idx}`;
                const canvasId = `canvas-${idx}`;

                const card = document.createElement('div');
                card.className = 'chart-card';
                card.id = cardId;
                card.innerHTML = `<h3>${param.name}</h3><div class="chart-container"><canvas id="${canvasId}"></canvas></div>`;
                grid.appendChild(card);

                const ctx = document.getElementById(canvasId).getContext('2d');
                chartInstances[canvasId] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: trimmed.labels,
                        datasets: [{
                            label: param.name,
                            data: trimmed.values,
                            backgroundColor: '#16a34a',
                            borderColor: '#15803d',
                            borderWidth: 1,
                            borderRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: '#64748b', maxTicksLimit: 6, font: { size: 10 } }
                            },
                            y: {
                                grid: { color: '#e2e8f0' },
                                ticks: { color: '#64748b', font: { size: 10 } }
                            }
                        }
                    }
                });
            });
        }

            const searchVal = document.getElementById('searchBox').value;
            renderDashboard(view, searchVal);
        }

        function filterCharts() {
            const searchVal = document.getElementById('searchBox').value;
            renderDashboard(currentView, searchVal);
