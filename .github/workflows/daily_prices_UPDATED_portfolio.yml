name: Daily prices

# Every weekday after the US market close (22:30 UTC = 01:30 Riyadh, Tue-Sat), refresh the daily
# closing prices in performance.html and the All-time table in alltime-performance.html.
# Prices: Yahoo first, Stooq if Yahoo fails (tools/update_prices.py). The pages make no lookups.
# Then the private portfolio (tools/portfolio/update_portfolio.py): prices + automatic target closes,
# encrypted with the PORTFOLIO_PASSWORD repository secret (skipped when the secret is not set).
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance cryptography
      - run: python tools/update_prices.py
      - name: Private portfolio
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        run: python tools/portfolio/update_portfolio.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- performance.html alltime-performance.html portfolio.html; then
            echo "No change to commit."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add performance.html alltime-performance.html
            if [ -f portfolio.html ]; then git add portfolio.html; fi
            git commit -m "Daily prices $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
